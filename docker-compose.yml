# ==========================================
# n8n 2.x en modo Queue
# main (UI + webhooks) + 2 workers + task runners externos
# PostgreSQL (DB) + Redis (cola)
# ==========================================

x-n8n-image: &n8n-image n8nio/n8n:2.47.7
x-runners-image: &runners-image n8nio/runners:2.47.7

# Variables comunes a main y workers
x-n8n-env: &n8n-env
  # Database
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: 5432
  DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
  DB_POSTGRESDB_USER: ${POSTGRES_USER}
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

  # Redis Queue
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_BULL_REDIS_PORT: 6379
  QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
  QUEUE_HEALTH_CHECK_ACTIVE: "true"
  # Ejecuciones manuales del editor también van a los workers
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"

  # Task runners (modo externo, sidecar n8nio/runners)
  N8N_RUNNERS_MODE: external
  N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
  N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
  N8N_NATIVE_PYTHON_RUNNER: "true"

  # Binary data (en queue mode se comparte vía DB)
  N8N_DEFAULT_BINARY_DATA_MODE: database

  # Security
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"

  # Timezone
  GENERIC_TIMEZONE: ${TIMEZONE}
  TZ: ${TIMEZONE}

  # Logging
  N8N_LOG_LEVEL: info

# Configuración común de runners
x-runner: &runner
  image: *runners-image
  restart: always
  networks:
    - n8n-network
  deploy:
    resources:
      limits:
        cpus: '0.5'
        memory: 512M

# Configuración común de workers
x-worker: &worker
  image: *n8n-image
  restart: always
  command: worker
  environment:
    <<: *n8n-env
    N8N_GRACEFUL_SHUTDOWN_TIMEOUT: 60
    N8N_CONCURRENCY_PRODUCTION_LIMIT: 10
  volumes:
    - n8n_data:/home/node/.n8n
    - ./n8n/nodes:/home/node/.n8n/nodes
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    n8n:
      condition: service_healthy
  networks:
    - n8n-network
  deploy:
    resources:
      limits:
        cpus: '1'
        memory: 1G

services:
  # ==========================================
  # PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - n8n-network

  # ==========================================
  # Redis for Queue Mode
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: n8n-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - n8n-network

  # ==========================================
  # n8n Main Instance (UI, API, Webhooks, MCP)
  # ==========================================
  n8n:
    image: *n8n-image
    container_name: n8n-main
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      <<: *n8n-env
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${WEBHOOK_URL}
      N8N_EDITOR_BASE_URL: ${WEBHOOK_URL}
      N8N_USER_MANAGEMENT_JWT_DURATION_HOURS: ${N8N_USER_MANAGEMENT_JWT_DURATION_HOURS}
      # Metrics
      N8N_METRICS: "true"
      N8N_METRICS_PREFIX: n8n_
      # Performance / retención
      N8N_PAYLOAD_SIZE_MAX: 16
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/nodes:/home/node/.n8n/nodes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5678/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - n8n-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  n8n-runner:
    <<: *runner
    container_name: n8n-runner
    environment:
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
    depends_on:
      - n8n

  # ==========================================
  # n8n Workers + sus task runners
  # ==========================================
  n8n-worker-1:
    <<: *worker
    container_name: n8n-worker-1

  n8n-worker-1-runner:
    <<: *runner
    container_name: n8n-worker-1-runner
    environment:
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n-worker-1:5679
    depends_on:
      - n8n-worker-1

  n8n-worker-2:
    <<: *worker
    container_name: n8n-worker-2

  n8n-worker-2-runner:
    <<: *runner
    container_name: n8n-worker-2-runner
    environment:
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n-worker-2:5679
    depends_on:
      - n8n-worker-2

# ==========================================
# Volumes
# ==========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  n8n_data:
    driver: local

# ==========================================
# Networks
# ==========================================
networks:
  n8n-network:
    driver: bridge
